  <!-- Script para a lógica matemática -->
  <script>
    // Função que formata o campo de texto como moeda R$ em tempo real
    function mascaraMoeda(input) {
      let valor = input.value;

      // Remove tudo o que não for dígito numérico
      valor = valor.replace(/\D/g, "");

      // Permite digitar até preencher os centavos
      valor = (valor / 100).toFixed(2) + "";

      // Substitui o ponto por vírgula para os centavos
      valor = valor.replace(".", ",");

      // Adiciona os pontos de milhar
      valor = valor.replace(/(\d)(?=(\d{3})+(?!\d))/g, "$1.");

      // Atualiza o valor do input (repara que removemos o R$ daqui porque ele já está no botão cinza do Bootstrap)
      input.value = valor === "0,00" ? "" : valor;
    }

    // Função que converte o texto formatado "1.234,56" de volta para número puro "1234.56"
    function converterParaNumero(valorTexto) {
      if (!valorTexto) return 0;
      // Remove os pontos de milhar e troca a vírgula decimal por ponto
      return parseFloat(valorTexto.replace(/\./g, '').replace(',', '.'));
    }

    function calcularMultiplicacao() {
      // Captura e trata os valores
      const preco = converterParaNumero(document.getElementById('valorMonetario').value);
      const qtd = parseFloat(document.getElementById('quantidade').value);

      const container = document.getElementById('resultadoContainer');
      const textoResultado = document.getElementById('textoResultado');

      // Validação simples
      if (preco <= 0 || isNaN(qtd) || qtd <= 0) {
        alert('Por favor, preencha os campos com valores maiores que zero.');
        return;
      }

      // Realiza o cálculo matemático
      const resultadoTotal = preco * qtd;

      // Formata o resultado final estrito em formato de moeda Real
      const resultadoFormatado = resultadoTotal.toLocaleString('pt-BR', {
        style: 'currency',
        currency: 'BRL'
      });

      // Exibe na tela
      textoResultado.innerText = resultadoFormatado;
      container.classList.remove('d-none');
    }
  </script>
